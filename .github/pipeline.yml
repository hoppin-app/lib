version: 1

# To run the complete pipeline on ft/* pushes, uncomment:
# feature_branches:
#   full: true

python:
  enable: true
  versions: ["3.12", "3.13"]
  requirements: [tools/requirements.txt]
  lint:
    # Pre-existing findings in make_vectors.py; fix them, then delete this.
    extend_ignore: [UP006, UP031, UP035]
  format:
    enable: false # make_vectors.py is not ruff-formatted yet
  test:
    runner: unittest
    tests_dir: tests
    coverage_min: 90
