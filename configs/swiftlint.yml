# Organisation baseline for Swift. Used when `ios.lint.config` is `lib` (the
# default). A repo can switch rules off with `ios.lint.disable_rules` in its
# pipeline.yml, or set `config: repo` to use its own .swiftlint.yml.

excluded:
  - lib
  - build
  - .build
  - DerivedData
  - Pods
  - Carthage

opt_in_rules:
  - closure_spacing
  - collection_alignment
  - contains_over_filter_count
  - contains_over_first_not_nil
  - empty_count
  - empty_string
  - explicit_init
  - first_where
  - force_unwrapping
  - implicit_return
  - last_where
  - overridden_super_call
  - redundant_nil_coalescing
  - sorted_first_last
  - unneeded_parentheses_in_closure_argument

analyzer_rules: []

line_length:
  warning: 140
  error: 200
  ignores_urls: true
  ignores_comments: true

file_length:
  warning: 800
  error: 1500

function_body_length:
  warning: 80
  error: 150

type_body_length:
  warning: 400
  error: 800

cyclomatic_complexity:
  warning: 15
  error: 30

identifier_name:
  min_length:
    warning: 2
  excluded: [id, i, j, x, y, z, db, ip, to, ok]
