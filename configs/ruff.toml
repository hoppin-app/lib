# Organisation baseline for Python. Used when `python.lint.config` is `lib`
# (the default). Repos that need their own rules set `config: repo`, or add
# `extend_ignore` in pipeline.yml for a handful of exceptions.

line-length = 100

exclude = [
  ".git",
  ".venv",
  "venv",
  "__pycache__",
  "build",
  "dist",
  "node_modules",
]

[lint]
select = [
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "F",    # pyflakes
  "I",    # isort
  "B",    # flake8-bugbear: likely bugs
  "UP",   # pyupgrade
  "C4",   # flake8-comprehensions
  "SIM",  # flake8-simplify
  "PL",   # pylint: code smells (complexity, too many args, ...)
  "RUF",  # ruff-specific
]
ignore = [
  "PLR2004",  # magic values in comparisons: too noisy for protocol constants
]

[lint.pylint]
max-args = 8
max-branches = 15
max-returns = 8
max-statements = 60

[lint.per-file-ignores]
"tests/**" = ["PLR0915", "PLR0913", "PLC0415"]

[format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
